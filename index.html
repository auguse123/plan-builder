<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230b7a5c%27/%3E%3Cpath d=%27M8 8h16v16H8z M8 16h8v8%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%272.4%27/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1112" />
    <title>Atelier de plans — desk-to-desk</title>
    <meta name="description" content="Dessiner et gérer des plans de bureaux, en local." />
    <!-- Le thème avant le premier rendu, sinon l'écran clignote en sombre.
         Même règle que `themeEffectif` (src/lib/outils/theme.js). -->
    <script>
      (function () {
        var t = 'systeme';
        try { t = localStorage.getItem('om-theme') || 'systeme'; } catch (e) {}
        var sombre = true;
        try { sombre = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
        var eff = t === 'clair' || t === 'sombre' ? t : (sombre ? 'sombre' : 'clair');
        document.documentElement.setAttribute('data-theme', eff);
        if (eff === 'clair') {
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#F9FAFB');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
